event-start-broadcast: "{prefix}<gold>⚔ KOTH has started! <gray>Fight for the hill — <yellow>{duration}<gray> remaining."
reset-broadcast: "{prefix}<gold>⚔ KOTH has started! <gray>Fight for the hill — <yellow>{duration}<gray> remaining."
event-end-broadcast: "{prefix}<gold>⚔ KOTH ended! <aqua>{player}<gold> wins with <yellow>{seconds}s<gold> on the hill!"
event-end-forced: "{prefix}<gold>⚔ KOTH was stopped! <aqua>{player}<gold> wins with <yellow>{seconds}s<gold> on the hill!"
